<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConSiente - Historial</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }
        
        body { 
            background: radial-gradient(circle at 50% 50%, #27312a 0%, #111412 100%); 
            min-height: 100vh; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar { 
            position:fixed; 
            top:0; 
            left: 0;
            width:100%; 
            height:65px; 
            background:#0d0d0d; 
            display:flex; 
            justify-content:space-between; 
            align-items:center; 
            padding:0 25px; 
            z-index:1000; 
            border-bottom: 1px solid rgba(129, 199, 132, 0.25); 
        }
        .logo-nombre { display:flex; align-items:center; gap:10px; }
        .titulo { font-size:20px; font-weight:bold; color:#ffffff; letter-spacing: 0.5px; }
        .logo { width:30px; }
        .menu { display:flex; align-items:center; gap:25px; }
        .menu a { text-decoration:none; color:#e0e0e0; font-size: 14px; transition: 0.3s ease; }
        .menu a:hover { color: #81c784; }

        /* NOTIFICACIONES */
        .notif-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .notif-icon-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            border: 1.5px solid rgba(129, 199, 132, 0.5);
            padding: 6px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.3s ease;
        }
        .notif-icon-img:hover {
            border-color: #81c784;
            background: rgba(129, 199, 132, 0.15);
            box-shadow: 0 0 10px rgba(129, 199, 132, 0.4);
        }
        .notif-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef5350;
            color: white;
            font-size: 10px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0d0d0d;
        }
        .notif-dropdown {
            position: absolute;
            right: 0;
            top: 50px;
            width: 340px;
            background: rgba(18, 22, 19, 0.98);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(129, 199, 132, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            z-index: 1200;
            overflow: hidden;
        }
        .notif-header {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notif-header h4 { color: #ffffff; font-size: 14px; font-weight: 700; }
        .notif-header span { color: #81c784; font-size: 11px; cursor: pointer; font-weight: 600; }
        .notif-list { max-height: 320px; overflow-y: auto; }
        .notif-item {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 12px;
            align-items: flex-start;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .notif-item:hover { background: rgba(46, 125, 50, 0.2); padding-left: 20px; }
        .notif-item.unread { background: rgba(129, 199, 132, 0.08); border-left: 3px solid #81c784; }
        .notif-detalles { flex: 1; }
        .notif-titulo-item { font-size: 13px; font-weight: 700; color: #81c784; margin-bottom: 2px; }
        .notif-texto { font-size: 12px; color: #cccccc; line-height: 1.4; }
        .notif-fecha { font-size: 10px; color: #888; margin-top: 4px; font-weight: 600; }

        /* MENÚ DE USUARIO */
        .user-menu { position: relative; display: flex; align-items: center; }
        .user-icon {
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
            border: 1.5px solid rgba(129, 199, 132, 0.5); transition: 0.3s ease; object-fit: cover;
        }
        .user-icon:hover { border-color: #81c784; box-shadow: 0 0 10px rgba(129, 199, 132, 0.4); }
        .dropdown {
            position: absolute; right: 0; top: 50px; background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(129, 199, 132, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); display: none; flex-direction: column; min-width: 160px; overflow: hidden; z-index: 1100;
        }
        .dropdown a {
            padding: 12px 18px; text-decoration: none; color: #ffffff; font-size: 14px; transition: 0.2s ease; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dropdown a:last-child { border-bottom: none; }
        .dropdown a:hover { background: rgba(46, 125, 50, 0.3); color: #81c784; }
        .show { display: flex; }

        /* ESTRUCTURA */
        .main-layout { display: flex; margin-top: 65px; min-height: calc(100vh - 65px); width: 100%; }

        /* SIDEBAR */
        .sidebar { 
            width: 280px; min-width: 280px; height: calc(100vh - 65px); position: sticky; top: 65px;
            background: #121212; border-right: 1px solid rgba(129, 199, 132, 0.15); padding: 25px 15px;
            display: flex; flex-direction: column; justify-content: space-between; z-index: 90;
        }
        .sidebar-menu { display: flex; flex-direction: column; }
        .sidebar button { 
            width: 100%; padding: 16px; margin-bottom: 15px; border: none; border-radius: 12px; 
            background: #1b1b1b; color: #ffffff; font-size: 15px; cursor: pointer; text-align: left; 
            border-bottom: 1px solid rgba(130,199,132,0.2); transition: 0.3s ease;
        }
        .sidebar button:hover, .sidebar button.btn-active { 
            background: #1c2d20; color: #81c784; border-bottom: 1px solid rgba(130,199,132,0.5); padding-left: 22px;
        }
        .footer-privacidad { padding-top: 15px; text-align: center; }
        .footer-privacidad a { color: rgba(255, 255, 255, 0.5); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.3s ease; }
        .footer-privacidad a:hover { color: #81c784; }

        /* CONTENEDOR PRINCIPAL */
        .container { 
            flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 25px; 
            max-width: 1200px; margin: 0 auto; width: 100%;
        }

        .box { 
            background: rgba(22, 22, 22, 0.85); backdrop-filter: blur(10px); border-radius: 20px; 
            padding: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); 
        }

        h2 { color: #81c784; font-weight: 600; font-size: 24px; margin-bottom: 20px; }

        /* TABLA DE HISTORIAL */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th { background: rgba(46, 125, 50, 0.2); color: #81c784; padding: 14px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; color: #e0e0e0; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .monto-gasto { color: #ef5350; font-weight: bold; }
        .badge-categoria {
            background: rgba(129, 199, 132, 0.15); color: #81c784; padding: 5px 10px;
            border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-block;
        }
        .btn-eliminar {
            background: rgba(239, 83, 80, 0.15); color: #ef5350; border: none; padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s ease;
        }
        .btn-eliminar:hover { background: #ef5350; color: white; }

        .sin-datos { text-align: center; padding: 30px; color: #888; font-style: italic; }

        /* RESPONSIVO MÓVIL */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; margin-top: 65px; min-height: auto; }
            .container { padding: 20px 15px 100px 15px; width: 100%; }
            
            .sidebar { 
                position: fixed; bottom: 0; top: auto; left: 0; width: 100%; min-width: 100%; height: 72px; 
                background: rgba(14, 14, 14, 0.97); backdrop-filter: blur(15px); border-right: none; 
                border-top: 1px solid rgba(129, 199, 132, 0.3); padding: 0; flex-direction: row; 
                justify-content: space-around; align-items: center; z-index: 1000;
            }
            .sidebar-menu { flex-direction: row; width: 100%; height: 100%; justify-content: space-around; align-items: center; }
            .sidebar button { 
                width: auto; flex: 1; height: 100%; padding: 10px 2px; margin-bottom: 0; border: none; 
                border-radius: 0; background: transparent; font-size: 11px; font-weight: 500; text-align: center; 
                display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #cccccc;
            }
            .sidebar button span { font-size: 18px; }
            .sidebar button:hover, .sidebar button.btn-active { background: rgba(255, 255, 255, 0.03); color: #81c784; padding-left: 2px; }
            .sidebar button.btn-active { color: #81c784; font-weight: bold; }
            .footer-privacidad { display: none; }
        }

        @media (max-width: 600px) {
            .navbar { padding: 0 15px; }
            .menu { gap: 12px; }
            .menu a { font-size: 13px; }
            .titulo { font-size: 18px; }
            .sidebar button { font-size: 10px; } 
            .sidebar button span { font-size: 16px; }
            .notif-dropdown { width: calc(100vw - 30px); right: -10px; max-height: 280px; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-nombre">
            <span class="titulo">ConSiente</span>
            <img src="imagenes/logo.png" class="logo" alt="Logo">
        </div>
        
        <div class="menu">
            <!-- NOTIFICACIONES -->
            <div class="notif-wrapper">
                <img src="imagenes/notificacion.png" class="notif-icon-img" id="notifBtn" alt="Notificaciones" title="Notificaciones">
                <span class="notif-badge" id="notifBadge" style="display:none;">0</span>

                <div class="notif-dropdown" id="notifDropdown">
                    <div class="notif-header">
                        <h4>Notificaciones</h4>
                        <span id="marcarTodasLeidasBtn">Marcar leídas</span>
                    </div>
                    <div class="notif-list" id="notifList"></div>
                </div>
            </div>

            <a href="menu.html">Home</a>
            <a href="nosotros.html">Sobre nosotros</a>
            <a href="ODS.html">ODS</a>
            
            <div class="user-menu">
                <img src="imagenes/usuario.png" class="user-icon" id="userBtn" alt="Usuario">
                <div class="dropdown" id="dropdownMenu">
                    <a href="config.html">Configuración</a>
                    <a href="index.html" onclick="cerrarSesion()">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </div>

    <div class="main-layout">
        
        <!-- SIDEBAR / BARRA INFERIOR MÓVIL (HISTORIAL ACTIVO) -->
        <div class="sidebar">
            <div class="sidebar-menu">
                <button onclick="window.location.href='menu.html'"><span>📊</span> Estadísticas</button>
                <button onclick="window.location.href='agregar.html'"><span>➕</span> Agregar</button>
                <button onclick="window.location.href='historial.html'" class="btn-active"><span>📅</span> Historial</button>
                <button onclick="window.location.href='semaforo.html'"><span>🚦</span> Semáforo</button>
                <button onclick="window.location.href='metas.html'">🎯 Metas</button>
                <button onclick="window.location.href='racha.html'">🔥 Racha</button>
                <button onclick="window.location.href='consejos.html'"><span>💡</span> Consejos</button>
            </div>
            <div class="footer-privacidad">
                <a href="privacidadentro.html">Políticas de Privacidad</a>
            </div>
        </div>

        <div class="container">
            <div class="box">
                <h2>Historial de Movimientos</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Categoría</th>
                                <th>Monto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial">
                            <tr>
                                <td colspan="4" class="sin-datos">Cargando movimientos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "";

        function cerrarSesion(){
            sessionStorage.removeItem("sesionActiva");
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/lista-gastos`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    const gastos = await res.json();
                    const tbody = document.getElementById("tablaHistorial");
                    tbody.innerHTML = "";

                    if (gastos.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="sin-datos">No hay movimientos registrados aún.</td></tr>`;
                        return;
                    }

                    gastos.forEach(g => {
                        const fechaFormateada = g.fecha ? g.fecha.split('T')[0] : 'Fecha no disponible';
                        const montoNum = Number(g.monto || g.cantidad || 0).toFixed(2);
                        
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${fechaFormateada}</td>
                            <td><span class="badge-categoria">${g.categoria || g.tipo || 'General'}</span></td>
                            <td class="monto-gasto">$ ${montoNum}</td>
                            <td><button class="btn-eliminar" onclick="eliminarGasto(${g.id})">Eliminar</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    document.getElementById("tablaHistorial").innerHTML = `<tr><td colspan="4" class="sin-datos">Error al cargar el historial.</td></tr>`;
                }
            } catch (error) {
                console.error("Error de red:", error);
                document.getElementById("tablaHistorial").innerHTML = `<tr><td colspan="4" class="sin-datos">No se pudo conectar con el servidor.</td></tr>`;
            }
        });

        async function eliminarGasto(id) {
            if (!confirm("¿Estás segura de que deseas eliminar este gasto?")) return;

            try {
                const token = localStorage.getItem("token");
                const res = await fetch(`${API_URL}/api/gastos/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    alert("✅ Gasto eliminado correctamente.");
                    location.reload();
                } else {
                    alert("❌ No se pudo eliminar el gasto.");
                }
            } catch (err) {
                console.error("Error al eliminar:", err);
                alert("❌ Error de red al intentar eliminar.");
            }
        }
    </script>
    
    <!-- SCRIPT GLOBAL DE NOTIFICACIONES -->
    <script src="/global-notificaciones.js" defer></script>
</body>
</html>

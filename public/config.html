<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConSiente - Configuración</title>
    <style>
        :root {
            --bg-dark: #27312a;
            --accent-green: #81c784; 
            --nav-black: #0d0d0d;
            --text-light: #e0e0e0;
            --text-muted: #bdbdbd;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }
        
        body { 
            background: radial-gradient(circle at 50% 50%, #27312a 0%, #111412 100%); 
            min-height: 100vh; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* NAVBAR */
        .navbar { 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 65px; 
            background: var(--nav-black); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 25px; 
            z-index: 2000; 
            border-bottom: 1px solid rgba(129, 199, 132, 0.25); 
        }
        .logo-nombre { display: flex; align-items: center; gap: 10px; }
        .titulo { font-size: 20px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; }
        .logo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        
        .menu { display: flex; align-items: center; gap: 20px; }
        .menu a { text-decoration: none; color: #e0e0e0; font-size: 14px; transition: 0.3s ease; white-space: nowrap; }
        .menu a:hover { color: var(--accent-green); }

        /* NOTIFICACIONES */
        .notif-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .notif-icon-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            border: 1.5px solid rgba(129, 199, 132, 0.5);
            padding: 6px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.3s ease;
        }

        .notif-icon-img:hover {
            border-color: var(--accent-green);
            background: rgba(129, 199, 132, 0.15);
            box-shadow: 0 0 10px rgba(129, 199, 132, 0.4);
        }

        .notif-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef5350;
            color: white;
            font-size: 10px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0d0d0d;
        }

        .notif-dropdown {
            position: absolute;
            right: 0;
            top: 50px;
            width: 340px;
            max-width: 90vw;
            background: rgba(18, 22, 19, 0.98);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(129, 199, 132, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            z-index: 2500;
            overflow: hidden;
        }
        .notif-dropdown.show { display: flex !important; }

        .notif-header {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notif-header h4 {
            color: #ffffff;
            font-size: 14px;
            margin: 0;
            font-weight: 700;
        }

        .notif-header span {
            color: var(--accent-green);
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .notif-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .notif-item {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 12px;
            align-items: flex-start;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .notif-item:hover {
            background: rgba(46, 125, 50, 0.2);
            padding-left: 20px;
        }

        .notif-item.unread {
            background: rgba(129, 199, 132, 0.08);
            border-left: 3px solid var(--accent-green);
        }

        .notif-detalles {
            flex: 1;
        }

        .notif-titulo-item {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 2px;
        }

        .notif-texto {
            font-size: 12px;
            color: #cccccc;
            line-height: 1.4;
        }

        .notif-fecha {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            font-weight: 600;
        }
        
        /* USUARIO DROPDOWN */
        .user-menu { position: relative; display: flex; align-items: center; }
        .user-icon { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 1.5px solid rgba(129, 199, 132, 0.5); transition: 0.3s ease; object-fit: cover; }
        .user-icon:hover { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(129, 199, 132, 0.4); }
        
        .dropdown { 
            position: absolute; right: 0; top: 50px; background: rgba(20, 20, 20, 0.98); 
            backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(129, 199, 132, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); display: none; flex-direction: column; min-width: 160px; overflow: hidden; z-index: 2500;
        }
        .dropdown a { padding: 12px 18px; text-decoration: none; color: white; font-size: 14px; transition: 0.2s ease; border-bottom: 1px solid rgba(255,255,255,0.05); display: block; }
        .dropdown a:last-child { border-bottom: none; }
        .dropdown a:hover { background: rgba(46, 125, 50, 0.3); color: var(--accent-green); }
        .show { display: flex !important; }

        /* LAYOUT GENERAL */
        .main-layout { display: flex; margin-top: 65px; min-height: calc(100vh - 65px); width: 100%; }

        /* SIDEBAR */
        .sidebar { 
            width: 280px; 
            min-width: 280px;
            background: #121212; 
            border-right: 1px solid rgba(129, 199, 132, 0.15); 
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar-nav { display: flex; flex-direction: column; }
        .sidebar button { 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 15px; 
            border: none; 
            border-radius: 12px; 
            background: #1b1b1b; 
            color: #ffffff;
            font-size: 15px; 
            cursor: pointer; 
            text-align: left; 
            border-bottom: 1px solid rgba(130,199,132,0.2); 
            transition: 0.3s ease; 
        }
        .sidebar button:hover { 
            background: #1c2d20; 
            color: var(--accent-green);
            border-bottom: 1px solid rgba(130,199,132,0.5); 
            padding-left: 22px;
        }
        
        .footer-privacidad { padding-top: 15px; text-align: center; }
        .footer-privacidad a { color: rgba(255, 255, 255, 0.5); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.3s ease; }
        .footer-privacidad a:hover { color: var(--accent-green); }

        /* CONTENIDO */
        .container { 
            flex: 1;
            padding: 40px; 
            display: flex; 
            flex-direction: column;
            gap: 25px; 
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .card-config { 
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            padding: 40px; 
            width: 100%; 
            max-width: 850px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); 
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #ffffff; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { 
            width: 100%; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.15);
            background: #1a1a1a; 
            color: white; 
            font-size: 15px;
            transition: 0.3s ease;
        }
        input:focus { outline: none; border-color: rgba(129, 199, 132, 0.7); background: #222222; box-shadow: 0 0 8px rgba(129, 199, 132, 0.2); }
        
        /* SELECCIÓN DE AVATARES */
        .avatares-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .avatar-opcion {
            background: #1b1b1b;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: not-allowed;
            transition: 0.3s ease;
        }
        .avatar-opcion img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(100%) opacity(0.3);
            transition: 0.3s ease;
        }
        .avatar-opcion span {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            text-align: center;
        }
        .avatar-opcion.desbloqueado {
            cursor: pointer;
            border-color: rgba(129, 199, 132, 0.4);
        }
        .avatar-opcion.desbloqueado img {
            filter: grayscale(0%) opacity(1);
        }
        .avatar-opcion.desbloqueado span {
            color: var(--accent-green);
        }
        .avatar-opcion.seleccionado {
            border-color: var(--accent-green);
            background: rgba(46, 125, 50, 0.15);
            box-shadow: 0 0 12px rgba(129, 199, 132, 0.4);
        }

        .btn-action { width: 100%; padding: 14px; background: #2e7d32; border: none; border-radius: 12px; color: #ffffff; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.3s ease; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3); }
        .btn-action:hover { background: #388e3c; box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4); }
        .btn-delete { background: #1a1616; border: 1px solid #951b1b; color: #ff5252; width: 100%; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.3s ease; }
        .btn-delete:hover { background: #2d1c1c; }

        /* MODALES */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; }
        .modal { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--accent-green); color: white; position: relative; }
        .close { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 20px; }
        .modal-acciones { display: flex; gap: 10px; margin-top: 20px; }
        
        h2 { color: var(--accent-green); font-weight: 600; letter-spacing: 0.3px; margin-bottom: 20px; font-size: 24px; }

        /* DISEÑO RESPONSIVO MÓVIL (BARRA INFERIOR FLOTANTE) */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; margin-top: 65px; min-height: auto; }
            
            .container { 
                padding: 20px 15px 100px 15px; 
                width: 100%; 
            }

            .card-config {
                padding: 25px;
            }
            
            .sidebar { 
                position: fixed; 
                bottom: 0; 
                top: auto; 
                left: 0; 
                width: 100%; 
                min-width: 100%; 
                height: 72px; 
                background: rgba(14, 14, 14, 0.97); 
                backdrop-filter: blur(15px);
                border-right: none; 
                border-top: 1px solid rgba(129, 199, 132, 0.3); 
                padding: 0; 
                flex-direction: row; 
                justify-content: space-around; 
                align-items: center; 
                z-index: 1000;
            }
            
            .sidebar-nav {
                flex-direction: row;
                width: 100%;
                height: 100%;
                justify-content: space-around;
                align-items: center;
            }

            .sidebar button { 
                width: auto; 
                flex: 1;
                height: 100%;
                padding: 10px 2px; 
                margin-bottom: 0; 
                border: none; 
                border-radius: 0;
                background: transparent; 
                font-size: 10px; 
                font-weight: 500;
                text-align: center; 
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                white-space: nowrap;
                color: #cccccc;
            }

            .sidebar button span {
                font-size: 16px; 
            }

            .sidebar button:hover { 
                background: rgba(255, 255, 255, 0.03); 
                color: var(--accent-green);
                padding-left: 2px; 
            }

            .footer-privacidad { display: none; }
        }

        @media (max-width: 600px) {
            .navbar { padding: 0 15px; }
            .menu { gap: 12px; }
            .menu a { font-size: 13px; }
            .titulo { font-size: 18px; }
            .sidebar button { font-size: 9px; } 
            .sidebar button span { font-size: 15px; }
            .notif-dropdown {
                width: calc(100vw - 30px);
                right: -10px;
                max-height: 280px;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo-nombre">
        <span class="titulo">ConSiente</span>
        <img src="imagenes/logo.png" class="logo" alt="Logo">
    </div>
    
    <div class="menu">
        <!-- NOTIFICACIONES -->
        <div class="notif-wrapper">
            <img src="imagenes/notificacion.png" class="notif-icon-img" id="notifBtn" alt="Notificaciones" title="Notificaciones">
            <span class="notif-badge" id="notifBadge" style="display:none;">0</span>

            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-header">
                    <h4>Notificaciones</h4>
                    <span id="marcarTodasLeidasBtn">Marcar leídas</span>
                </div>
                <div class="notif-list" id="notifList"></div>
            </div>
        </div>

        <a href="menu.html">Home</a>
        <a href="nosotros.html">Sobre nosotros</a>
        <a href="ODS.html">ODS</a>

        <div class="user-menu">
            <img src="imagenes/usuario.png" class="user-icon" id="userBtn" alt="Usuario">
            <div class="dropdown" id="dropdownMenu">
                <a href="config.html">Configuración</a>
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</div>

<div class="main-layout">
    <div class="sidebar">
        <div class="sidebar-nav">
            <button onclick="window.location.href='menu.html'"><span>📊</span> Estadísticas</button>
            <button onclick="window.location.href='agregar.html'"><span>➕</span> Agregar</button>
            <button onclick="window.location.href='historial.html'"><span>📅</span> Historial</button>
            <button onclick="window.location.href='semaforo.html'"><span>🚦</span> Semáforo</button>
            <button onclick="window.location.href='metas.html'"><span>🎯</span> Metas</button>
            <button onclick="window.location.href='racha.html'"><span>🔥</span> Racha</button>
            <button onclick="window.location.href='consejos.html'"><span>💡</span> Consejos</button>
        </div>
        <div class="footer-privacidad">
            <a href="privacidadentro.html">Políticas de Privacidad</a>
        </div>
    </div>

    <div class="container">
        <div class="card-config">
            <h2>Configuración de Perfil</h2>
            <div class="form-group"><label>Nombre</label><input type="text" id="nombreUsuario"></div>
            <div class="form-group"><label>Saldo</label><input type="number" id="saldoMensual"></div>
            
            <div class="form-group" style="margin-top: 25px;">
                <label>Selecciona tu Foto de Perfil (Avatares Desbloqueados)</label>
                <div class="avatares-grid" id="gridAvataresConfig">
                    <!-- Dinámico -->
                </div>
            </div>

            <button class="btn-action" style="margin-top: 15px;" onclick="abrirConfirm('Guardar Cambios', '¿Confirmas actualizar tu perfil y foto?', guardarPerfil)">Guardar Cambios</button>
        </div>

        <div class="card-config">
            <h2>Seguridad</h2>
            <button class="btn-action" onclick="document.getElementById('recuperacionModal').style.display='flex'">Enviar correo de cambio de contraseña</button>
        </div>

        <div class="card-config" style="border: 1px solid #951b1b;">
            <h2>Zona de Peligro</h2>
            <button class="btn-delete" onclick="abrirConfirm('Eliminar Cuenta', '¡Acción irreversible! Se borrará todo tu historial de gastos de forma permanente.', eliminarCuenta)">Eliminar mi cuenta</button>
        </div>
    </div>
</div>

<div class="overlay" id="modalConfirm">
    <div class="modal">
        <h3 id="mTitle" style="color:var(--accent-green)"></h3>
        <p id="mMsg" style="margin:20px 0; color:#ccc"></p>
        <div class="modal-acciones">
            <button class="btn-action" id="mConf" style="flex:1">Confirmar</button>
            <button class="btn-delete" onclick="document.getElementById('modalConfirm').style.display='none'" style="flex:1">Cancelar</button>
        </div>
    </div>
</div>

<div class="overlay" id="recuperacionModal">
    <div class="modal">
        <span class="close" onclick="document.getElementById('recuperacionModal').style.display='none'">✖</span>
        <div class="title" style="font-size: 20px; color: var(--accent-green); margin-bottom: 15px; font-weight:600;">Recuperar cuenta</div>
        <form id="formRecuperacion">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="correoRecuperar" required>
            </div>
            <button type="submit" class="btn-action">Solicitar Enlace</button>
        </form>
    </div>
</div>

<script>
    const API_URL = "";

    let avatarSeleccionadoRuta = "";
    let infoUsuarioGlobal = null;

    document.addEventListener("DOMContentLoaded", () => {
        const userBtn = document.getElementById("userBtn");
        const dropdownMenu = document.getElementById("dropdownMenu");
        const notifBtn = document.getElementById("notifBtn");
        const notifDropdown = document.getElementById("notifDropdown");

        if (userBtn && dropdownMenu) {
            userBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (notifDropdown) notifDropdown.classList.remove("show");
                dropdownMenu.classList.toggle("show");
            });
        }

        if (notifBtn && notifDropdown) {
            notifBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (dropdownMenu) dropdownMenu.classList.remove("show");
                notifDropdown.classList.toggle("show");
            });
        }

        window.addEventListener("click", (e) => {
            if (dropdownMenu && userBtn && !userBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                dropdownMenu.classList.remove("show");
            }
            if (notifDropdown && notifBtn && !notifBtn.contains(e.target) && !notifDropdown.contains(e.target)) {
                notifDropdown.classList.remove("show");
            }
        });

        cargarPerfilYAvatares();
        cargarNotificacionesLocales();
    });

    async function cargarPerfilYAvatares() {
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "index.html";
            return;
        }

        let userId = "7";

        try {
            const resPerfil = await fetch(`${API_URL}/api/perfil`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (resPerfil.ok) {
                infoUsuarioGlobal = await resPerfil.json();
                userId = infoUsuarioGlobal.id || infoUsuarioGlobal.usuario_id || "7";
                
                document.getElementById("nombreUsuario").value = infoUsuarioGlobal.nombre || "";
                document.getElementById("saldoMensual").value = infoUsuarioGlobal.saldo || 0;
                avatarSeleccionadoRuta = infoUsuarioGlobal.avatar || "imagenes/usuario.png";
                
                document.getElementById("userBtn").src = avatarSeleccionadoRuta;
            }
        } catch (error) {
            console.error("Error al cargar perfil:", error);
        }

        const sufijoUser = `_${userId}`;

        const avataresBase = [
            {
                nombre: 'PuerQuito',
                gris: 'imagenes/perfiles/puerquito_gris.png',
                color: 'imagenes/perfiles/puerquito_color.png',
                desbloqueado: localStorage.getItem("reclamado_premio_admin" + sufijoUser) === "true" || localStorage.getItem("reclamado_mision_1" + sufijoUser) === "true"
            },
            {
                nombre: 'Monedín',
                gris: 'imagenes/perfiles/monedin_gris.png',
                color: 'imagenes/perfiles/monedin_color.png',
                desbloqueado: localStorage.getItem("reclamado_premio_semanas" + sufijoUser) === "true" || localStorage.getItem("reclamado_mision_2" + sufijoUser) === "true"
            },
            {
                nombre: 'Antojina',
                gris: 'imagenes/perfiles/antojina_gris.png',
                color: 'imagenes/perfiles/antojina_color.png',
                desbloqueado: localStorage.getItem("reclamado_premio_metas_cumplidas" + sufijoUser) === "true" || localStorage.getItem("reclamado_mision_3" + sufijoUser) === "true"
            },
            {
                nombre: 'Don Deuda',
                gris: 'imagenes/perfiles/dondeuda_gris.png',
                color: 'imagenes/perfiles/dondeuda_color.png',
                desbloqueado: localStorage.getItem("reclamado_premio_presupuesto" + sufijoUser) === "true" || localStorage.getItem("reclamado_mision_4" + sufijoUser) === "true"
            },
            {
                nombre: 'El Estafador',
                gris: 'imagenes/perfiles/estafador_gris.png',
                color: 'imagenes/perfiles/estafador_color.png',
                desbloqueado: localStorage.getItem("reclamado_premio_gastos_mensuales" + sufijoUser) === "true" || localStorage.getItem("reclamado_mision_5" + sufijoUser) === "true"
            },
            {
                nombre: 'El Ladrón',
                gris: 'imagenes/perfiles/ladron_gris.png',
                color: 'imagenes/perfiles/ladron_color.png',
                desbloqueado: localStorage.getItem("reclamado_premio_simultaneas" + sufijoUser) === "true" || localStorage.getItem("reclamado_mision_6" + sufijoUser) === "true"
            }
        ];

        let avataresDinamicos = [];
        try {
            const resMisiones = await fetch(`${API_URL}/api/misiones`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (resMisiones.ok) {
                const listaMisiones = await resMisiones.json();
                const misionesExtra = listaMisiones.filter(m => Number(m.id) > 6);

                avataresDinamicos = misionesExtra.map(m => {
                    const yaReclamado = localStorage.getItem(`reclamado_mision_${m.id}${sufijoUser}`) === "true";
                    return {
                        nombre: m.recompensa ? m.recompensa.replace('avatar: ', '') : m.titulo,
                        gris: m.imagen_gris || 'imagenes/usuario.png',
                        color: m.imagen_color || m.imagen_gris || 'imagenes/usuario.png',
                        desbloqueado: yaReclamado
                    };
                });
            }
        } catch (e) {
            console.error("Error al cargar misiones dinámicas en config:", e);
        }

        renderizarGridAvatares([...avataresBase, ...avataresDinamicos]);
    }

    async function cargarNotificacionesLocales() {
        const token = localStorage.getItem("token");
        if (!token) return;
        try {
            const res = await fetch(`${API_URL}/api/notificaciones`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (res.ok) {
                const notificaciones = await res.json();
                const lista = document.getElementById("notifList");
                const badge = document.getElementById("notifBadge");
                if (!lista) return;
                
                lista.innerHTML = "";
                let noLeidas = 0;

                if (notificaciones.length === 0) {
                    lista.innerHTML = `<div style="padding: 20px; text-align: center; color: #888; font-size: 13px;">No hay notificaciones</div>`;
                } else {
                    notificaciones.forEach(n => {
                        if (!n.leida) noLeidas++;
                        lista.innerHTML += `
                            <div class="notif-item ${n.leida ? '' : 'unread'}">
                                <div class="notif-detalles">
                                    <div class="notif-titulo-item">${n.titulo}</div>
                                    <div class="notif-texto">${n.mensaje}</div>
                                    <div class="notif-fecha">${n.fecha || ''}</div>
                                </div>
                            </div>
                        `;
                    });
                }

                if (badge) {
                    if (noLeidas > 0) {
                        badge.style.display = "flex";
                        badge.innerText = noLeidas;
                    } else {
                        badge.style.display = "none";
                    }
                }
            }
        } catch (e) {
            console.error("Error al cargar notificaciones:", e);
        }
    }

    function renderizarGridAvatares(lista) {
        const grid = document.getElementById("gridAvataresConfig");
        grid.innerHTML = "";

        let htmlGrid = `
            <div class="avatar-opcion desbloqueado ${avatarSeleccionadoRuta === 'imagenes/usuario.png' ? 'seleccionado' : ''}" onclick="seleccionarAvatar('imagenes/usuario.png', this)">
                <img src="imagenes/usuario.png" alt="Predeterminado">
                <span>Predeterminado</span>
            </div>
        `;

        lista.forEach(av => {
            const esDesbloqueado = av.desbloqueado;
            const imagenSrc = esDesbloqueado ? av.color : av.gris;
            const claseDesbloqueado = esDesbloqueado ? "desbloqueado" : "";
            const esSeleccionado = avatarSeleccionadoRuta === av.color ? "seleccionado" : "";
            const eventoClick = esDesbloqueado ? `onclick="seleccionarAvatar('${av.color}', this)"` : `onclick="alert('Este avatar está bloqueado. Ve a la sección de Racha, cumple la misión y haz clic en Desbloquear para reclamarlo.')"`;

            htmlGrid += `
                <div class="avatar-opcion ${claseDesbloqueado} ${esSeleccionado}" ${eventoClick}>
                    <img src="${imagenSrc}" alt="${av.nombre}">
                    <span>${av.nombre}</span>
                </div>
            `;
        });

        grid.innerHTML = htmlGrid;
    }

    function seleccionarAvatar(rutaColor, elementoHtml) {
        avatarSeleccionadoRuta = rutaColor;
        document.querySelectorAll(".avatar-opcion").forEach(el => el.classList.remove("seleccionado"));
        elementoHtml.classList.add("seleccionado");
        document.getElementById("userBtn").src = rutaColor;
    }

    function cerrarSesion(){
        localStorage.clear();
        window.location.href = "index.html";
    }

    function abrirConfirm(t, m, fn) {
        document.getElementById("mTitle").innerText = t;
        document.getElementById("mMsg").innerText = m;
        document.getElementById("mConf").onclick = () => { 
            fn(); 
            document.getElementById('modalConfirm').style.display = 'none'; 
        };
        document.getElementById("modalConfirm").style.display = "flex";
    }

    async function guardarPerfil() {
        const token = localStorage.getItem("token");
        const nuevoNombre = document.getElementById("nombreUsuario").value;
        const nuevoSaldo = parseFloat(document.getElementById("saldoMensual").value);

        try {
            const res = await fetch(`${API_URL}/api/perfil`, {
                method: "PUT",
                headers: { 
                    "Authorization": `Bearer ${token}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ nombre: nuevoNombre, saldo: nuevoSaldo })
            });

            const resAvatar = await fetch(`${API_URL}/api/perfil/avatar`, {
                method: "PUT",
                headers: { 
                    "Authorization": `Bearer ${token}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ avatar: avatarSeleccionadoRuta })
            });

            if (res.ok && resAvatar.ok) {
                alert("¡Perfil actualizado con éxito!");
                cargarPerfilYAvatares(); 
            } else {
                alert("Error al actualizar los datos en el servidor.");
            }
        } catch (error) {
            console.error("Error de red:", error);
            alert("No se pudo conectar con el servidor.");
        }
    }

    async function eliminarCuenta() {
        const token = localStorage.getItem("token");
        if (!token) return window.location.href = "index.html";

        try {
            const res = await fetch(`${API_URL}/api/cuenta`, { 
                method: "DELETE", 
                headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }
            });
            
            if (res.ok) {
                alert("Tu cuenta ha sido eliminada permanentemente.");
                localStorage.clear();
                window.location.href = "index.html";
            } else {
                alert("No se pudo eliminar la cuenta.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    document.getElementById("formRecuperacion").onsubmit = async (e) => {
        e.preventDefault();
        const correo = document.getElementById("correoRecuperar").value;
        try {
            const response = await fetch(`${API_URL}/api/solicitar-recuperacion`, { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify({ correo }) 
            });
            const data = await response.json();
            alert(data.message || "Proceso ejecutado."); 
            if (response.ok) {
                document.getElementById('recuperacionModal').style.display = 'none';
                document.getElementById("formRecuperacion").reset();
            }
        } catch (error) {
            console.error("Error:", error);
        }
    };
</script>

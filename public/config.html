<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ConSiente</title>
    <style>
        :root {
            --bg-dark: #27312a;
            --accent-green: #81c784; 
            --nav-black: #111111;
            --text-light: #e0e0e0;
            --text-muted: #bdbdbd;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }
        body { background: radial-gradient(circle at 50% 50%, #27312a 0%, #111412 100%); min-height: 100vh; color: #ffffff; display: flex; flex-direction: column; }

        /* NAVBAR - Sincronizada con el resto de la app */
        .navbar { 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 65px; 
            background: var(--nav-black); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 25px; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(129, 199, 132, 0.25); 
        }
        .logo-nombre { display: flex; align-items: center; gap: 10px; }
        .titulo { font-size: 20px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; }
        .logo { width: 30px; }
        
        .menu-container { display: flex; gap: 25px; align-items: center; height: 100%; }
        .menu { display: flex; gap: 25px; list-style: none; }
        .menu a { text-decoration: none; color: #e0e0e0; font-size: 14px; transition: 0.3s ease; }
        .menu a:hover { color: var(--accent-green); }
        
        /* MENÚ DE USUARIO DESLIZABLE / DROPDOWN */
        .user-menu { position: relative; display: flex; align-items: center; }
        .user-icon { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 1.5px solid rgba(129, 199, 132, 0.5); transition: 0.3s ease; object-fit: cover; }
        .user-icon:hover { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(129, 199, 132, 0.4); }
        
        .dropdown { 
            position: absolute; 
            right: 0; 
            top: 50px; 
            background: rgba(20, 20, 20, 0.98); 
            backdrop-filter: blur(10px);
            border-radius: 12px; 
            border: 1px solid rgba(129, 199, 132, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: none; 
            flex-direction: column; 
            min-width: 160px; 
            overflow: hidden;
            z-index: 1100;
        }
        .dropdown a { padding: 12px 18px; text-decoration: none; color: white; font-size: 14px; transition: 0.2s ease; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .dropdown a:last-child { border-bottom: none; }
        .dropdown a:hover { background: rgba(46, 125, 50, 0.3); color: var(--accent-green); }
        .show { display: flex; }

        /* SIDEBAR */
        .main-layout { display: flex; margin-top: 65px; min-height: calc(100vh - 65px); width: 100%; }
        .sidebar { width: 280px; min-width: 280px; background: #121212; border-right: 1px solid rgba(129, 199, 132, 0.15); padding: 25px 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-nav { display: flex; flex-direction: column; }
        .sidebar button { width:100%; padding:16px; margin-bottom:15px; border:none; border-radius:12px; background:#1b1b1b; color:#ffffff; font-size:15px; cursor:pointer; text-align:left; border-bottom:1px solid rgba(130,199,132,0.2); transition: 0.3s ease; }
        .sidebar button:hover { background:#1c2d20; color: var(--accent-green); border-bottom:1px solid rgba(130,199,132,0.5); padding-left: 22px; }
        .footer-privacidad { padding-top: 15px; text-align: center; }
        .footer-privacidad a { color: rgba(255, 255, 255, 0.5); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.3s ease; }
        .footer-privacidad a:hover { color: var(--accent-green); }

        /* CONTENIDO */
        .container { flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 25px; align-items: center; max-width: 1200px; margin: 0 auto; }
        .card-config { background: rgba(22, 22, 22, 0.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; width: 100%; max-width: 850px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #ffffff; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: #1a1a1a; color: white; font-size: 15px; transition: 0.3s ease; }
        input:focus { outline: none; border-color: rgba(129, 199, 132, 0.7); background: #222222; box-shadow: 0 0 8px rgba(129, 199, 132, 0.2); }
        
        .btn-action { width: 100%; padding: 14px; background: #2e7d32; border: none; border-radius: 12px; color: #ffffff; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.3s ease; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3); }
        .btn-action:hover { background: #388e3c; box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4); }
        .btn-delete { background: #1a1616; border: 1px solid #951b1b; color: #ff5252; width: 100%; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.3s ease; }
        .btn-delete:hover { background: #2d1c1c; }

        /* MODALES */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; }
        .modal { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 400px; border: 1px solid var(--accent-green); color: white; position: relative; }
        .close { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 20px; }
        .modal-acciones { display: flex; gap: 10px; margin-top: 20px; }
        
        h2 { color: var(--accent-green); font-weight: 600; letter-spacing: 0.3px; margin-bottom: 20px; font-size: 24px; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo-nombre">
        <span class="titulo">ConSiente</span>
        <img src="imagenes/logo.png" class="logo" alt="Logo">
    </div>
    
    <div class="menu-container">
        <ul class="menu">
            <li><a href="menu.html">Home</a></li>
            <li><a href="nosotros.html">Sobre nosotros</a></li>
            <li><a href="ODS.html">ODS</a></li>
        </ul>
        <div class="user-menu">
            <img src="imagenes/usuario.png" class="user-icon" id="userBtn" alt="Usuario">
            <div class="dropdown" id="dropdownMenu">
                <a href="config.html">Configuración</a>
                <a href="index.html" onclick="localStorage.clear()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</div>

<div class="main-layout">
    <div class="sidebar">
        <div class="sidebar-nav">
            <button onclick="location.href='menu.html'">📊 Mis Estadísticas</button>
            <button onclick="location.href='consejos.html'">💡 Consejos</button>
            <button onclick="location.href='agregar.html'">➕ Agregar gasto</button>
            <button onclick="location.href='historial.html'">📅 Historial</button>
            <button onclick="window.location.href='semaforo.html'">🚦 Semáforo Financiero</button>
        </div>
        <div class="footer-privacidad"><a href="privacidadentro.html">Políticas de Privacidad</a></div>
    </div>

    <div class="container">
        <div class="card-config">
            <h2>Configuración de Perfil</h2>
            <div class="form-group"><label>Nombre</label><input type="text" id="nombreUsuario"></div>
            <div class="form-group"><label>Saldo</label><input type="number" id="saldoMensual"></div>
            <button class="btn-action" onclick="abrirConfirm('Guardar Cambios', '¿Confirmas actualizar tu perfil?', guardarPerfil)">Guardar Cambios</button>
        </div>

        <div class="card-config">
            <h2>Seguridad</h2>
            <button class="btn-action" onclick="document.getElementById('recuperacionModal').style.display='flex'">Enviar correo de cambio de contraseña</button>
        </div>

        <div class="card-config" style="border: 1px solid #951b1b;">
            <h2>Zona de Peligro</h2>
            <button class="btn-delete" onclick="abrirConfirm('Eliminar Cuenta', '¡Acción irreversible! Se borrará todo tu historial de gastos de forma permanente.', eliminarCuenta)">Eliminar mi cuenta</button>
        </div>
    </div>
</div>

<div class="overlay" id="modalConfirm">
    <div class="modal">
        <h3 id="mTitle" style="color:var(--accent-green)"></h3>
        <p id="mMsg" style="margin:20px 0; color:#ccc"></p>
        <div class="modal-acciones">
            <button class="btn-action" id="mConf" style="flex:1">Confirmar</button>
            <button class="btn-delete" onclick="document.getElementById('modalConfirm').style.display='none'" style="flex:1">Cancelar</button>
        </div>
    </div>
</div>

<div class="overlay" id="recuperacionModal">
    <div class="modal">
        <span class="close" onclick="document.getElementById('recuperacionModal').style.display='none'">✖</span>
        <div class="title" style="font-size: 20px; color: var(--accent-green); margin-bottom: 15px; font-weight:600;">Recuperar cuenta</div>
        <form id="formRecuperacion">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="correoRecuperar" required>
            </div>
            <button type="submit" class="btn-action">Solicitar Enlace</button>
        </form>
    </div>
</div>

<script>
    // 1. AL CARGAR LA PÁGINA: Traer los datos actuales de la Base de Datos
    document.addEventListener("DOMContentLoaded", cargarPerfil);

    async function cargarPerfil() {
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "index.html";
            return;
        }

        try {
            const res = await fetch("http://localhost:3000/api/perfil", {
                method: "GET",
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            if (res.ok) {
                const datosUsuario = await res.json();
                document.getElementById("nombreUsuario").value = datosUsuario.nombre || "";
                document.getElementById("saldoMensual").value = datosUsuario.saldo || 0;
            } else {
                console.error("No se pudieron cargar los datos del perfil.");
            }
        } catch (error) {
            console.error("Error de conexión al cargar perfil:", error);
        }
    }

    // Toggle Menú de Usuario
    document.getElementById("userBtn").onclick = (e) => { 
        e.stopPropagation(); 
        document.getElementById("dropdownMenu").classList.toggle("show"); 
    };
    
    window.onclick = () => { 
        document.getElementById("dropdownMenu").classList.remove("show"); 
    };

    // Lógica del Modal de Confirmación genérico
    function abrirConfirm(t, m, fn) {
        document.getElementById("mTitle").innerText = t;
        document.getElementById("mMsg").innerText = m;
        document.getElementById("mConf").onclick = () => { 
            fn(); 
            document.getElementById('modalConfirm').style.display = 'none'; 
        };
        document.getElementById("modalConfirm").style.display = "flex";
    }

    // 2. MODIFICAR: Guardar los cambios nuevos directamente en la Base de Datos (API PUT)
    async function guardarPerfil() {
        const token = localStorage.getItem("token");
        const nuevoNombre = document.getElementById("nombreUsuario").value;
        const nuevoSaldo = parseFloat(document.getElementById("saldoMensual").value);

        try {
            const res = await fetch("http://localhost:3000/api/perfil", {
                method: "PUT",
                headers: { 
                    "Authorization": `Bearer ${token}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ 
                    nombre: nuevoNombre, 
                    saldo: nuevoSaldo 
                })
            });

            if (res.ok) {
                alert("¡Perfil actualizado con éxito en la base de datos!");
                cargarPerfil(); 
            } else {
                const errorData = await res.json();
                alert("Error al actualizar: " + (errorData.mensaje || "Error del servidor"));
            }
        } catch (error) {
            console.error("Error de red al intentar actualizar:", error);
            alert("No se pudo conectar con el servidor para guardar los cambios.");
        }
    }

    // =========================================================
    // FUNCIÓN OPTIMIZADA: Eliminar Cuenta (Enlazada al Backend)
    // =========================================================
    async function eliminarCuenta() {
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Sesión inválida.");
            window.location.href = "index.html";
            return;
        }

        try {
            const res = await fetch("http://localhost:3000/api/cuenta", { 
                method: "DELETE", 
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json" 
                }
            });
            
            const data = await res.json();

            if (res.ok) {
                alert("Tu cuenta ha sido eliminada permanentemente. Gracias por usar ConSiente.");
                localStorage.clear();
                window.location.href = "index.html";
            } else {
                alert("Error del servidor: " + (data.message || "No se pudo eliminar la cuenta."));
            }
        } catch (error) {
            console.error("Error al procesar la baja:", error);
            alert("Error de red: No se pudo conectar con el servidor para eliminar la cuenta.");
        }
    }

    // ENLAZADO DIRECTAMENTE CON TU RUTA DE RECUPERACIÓN EXISTENTE EN EL BACKEND
    document.getElementById("formRecuperacion").onsubmit = async (e) => {
        e.preventDefault();
        const correo = document.getElementById("correoRecuperar").value;
        
        try {
            const response = await fetch("http://localhost:3000/api/solicitar-recuperacion", { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify({ correo }) 
            });
            
            const data = await response.json();
            alert(data.message || "Proceso de recuperación ejecutado."); 
            
            if (response.ok) {
                document.getElementById('recuperacionModal').style.display = 'none';
                document.getElementById("formRecuperacion").reset();
            }
        } catch (error) {
            console.error("Error al procesar la solicitud:", error);
            alert("Error al comunicarse con el servidor.");
        }
    };
</script>
</body>
</html>

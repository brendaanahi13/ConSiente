<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConSiente - Configuración</title>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }

        body {
            background: radial-gradient(circle at 50% 50%, #27312a 0%, #111412 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* NAVBAR */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 65px; background: #0d0d0d;
            display: flex; justify-content: space-between; align-items: center; padding: 0 25px;
            z-index: 2000; border-bottom: 1px solid rgba(129, 199, 132, 0.25);
        }
        .logo-nombre { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .titulo { font-size: 20px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; }
        .logo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .menu { display: flex; align-items: center; gap: 18px; min-width: 0; }
        .menu a { text-decoration: none; color: #e0e0e0; font-size: 14px; transition: 0.3s ease; white-space: nowrap; cursor: pointer; }
        .menu a:hover { color: #81c784; }

        .btn-volver-admin-menu {
            display: none;
            align-items: center;
            gap: 5px;
            background: rgba(46, 125, 50, 0.25);
            color: #81c784 !important;
            border: 1px solid rgba(129, 199, 132, 0.45);
            padding: 6px 11px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px !important;
            flex-shrink: 0;
        }
        .btn-volver-admin-menu:hover {
            background: #2e7d32;
            color: #ffffff !important;
        }
        .admin-texto-corto {
            display: none;
        }

        /* NOTIFICACIONES */
        .notif-wrapper { position: relative; display: flex; align-items: center; flex-shrink: 0; }
        .notif-icon-img {
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
            border: 1.5px solid rgba(129, 199, 132, 0.5); padding: 6px; object-fit: contain;
            background: rgba(255, 255, 255, 0.05); transition: 0.3s ease;
        }
        .notif-icon-img:hover { border-color: #81c784; background: rgba(129, 199, 132, 0.15); box-shadow: 0 0 10px rgba(129, 199, 132, 0.4); }
        .notif-badge {
            position: absolute; top: -2px; right: -2px; background: #ef5350; color: white;
            font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 2px solid #0d0d0d;
        }
        .notif-dropdown {
            position: absolute; right: 0; top: 50px; width: 340px; max-width: 90vw; background: rgba(18, 22, 19, 0.98);
            backdrop-filter: blur(15px); border-radius: 16px; border: 1px solid rgba(129, 199, 132, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); display: none; flex-direction: column; z-index: 2500; overflow: hidden;
        }
        .notif-dropdown.show { display: flex !important; }
        .notif-header {
            padding: 14px 18px; background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center;
        }
        .notif-header h4 { color: #ffffff; font-size: 14px; font-weight: 700; }
        .notif-header span { color: #81c784; font-size: 11px; cursor: pointer; font-weight: 600; }
        .notif-list { max-height: 320px; overflow-y: auto; }
        .notif-item {
            padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex; gap: 12px; align-items: flex-start; cursor: pointer; transition: all 0.2s ease;
        }
        .notif-item:hover { background: rgba(46, 125, 50, 0.2); }
        .notif-item.unread { background: rgba(129, 199, 132, 0.08); border-left: 3px solid #81c784; }
        .notif-detalles { flex: 1; min-width: 0; }
        .notif-titulo-item { font-size: 13px; font-weight: 700; color: #81c784; margin-bottom: 2px; word-break: break-word; }
        .notif-texto { font-size: 12px; color: #cccccc; line-height: 1.4; white-space: pre-line; word-break: break-word; }
        .notif-fecha { font-size: 10px; color: #81c784; margin-top: 4px; font-weight: 500; }

        /* MENÚ USUARIO */
        .user-menu { position: relative; display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
        .user-icon { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 1.5px solid rgba(129, 199, 132, 0.5); transition: 0.3s ease; object-fit: cover; }
        .user-icon:hover { border-color: #81c784; box-shadow: 0 0 10px rgba(129, 199, 132, 0.4); }
        .dropdown {
            position: absolute; right: 0; top: 50px; background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(129, 199, 132, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); display: none; flex-direction: column; min-width: 160px; overflow: hidden; z-index: 2500;
        }
        .dropdown a { padding: 12px 18px; text-decoration: none; color: #ffffff; font-size: 14px; transition: 0.2s ease; border-bottom: 1px solid rgba(255,255,255,0.05); display: block; }
        .dropdown a:last-child { border-bottom: none; }
        .dropdown a:hover { background: rgba(46, 125, 50, 0.3); color: #81c784; }
        .dropdown.show { display: flex !important; }

        /* LAYOUT GENERAL */
        .main-layout { display: flex; margin-top: 65px; min-height: calc(100vh - 65px); width: 100%; }

        /* SIDEBAR */
        .sidebar { width: 280px; min-width: 280px; background: #121212; border-right: 1px solid rgba(129, 199, 132, 0.15); padding: 25px 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-menu { display: flex; flex-direction: column; }
        .sidebar button {
            width: 100%; padding: 16px; margin-bottom: 15px; border: none; border-radius: 12px;
            background: #1b1b1b; color: #ffffff; font-size: 15px; cursor: pointer; text-align: left;
            border-bottom: 1px solid rgba(130,199,132,0.2); transition: 0.3s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar button:hover, .sidebar button.active { background: #1c2d20; color: #81c784; border-bottom: 1px solid rgba(130,199,132,0.5); padding-left: 22px; }
        .sidebar button.active { color: #81c784; font-weight: bold; }

        .label-movil {
            display: none;
        }

        .footer-privacidad { padding-top: 15px; text-align: center; }
        .footer-privacidad a { color: rgba(255, 255, 255, 0.5); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.3s ease; }
        .footer-privacidad a:hover { color: #81c784; }

        /* CONTENIDO PRINCIPAL */
        .container { flex: 1; padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; }
        h2 { color: #81c784; font-weight: 600; letter-spacing: 0.3px; margin-bottom: 20px; font-size: 26px; }

        .box-config {
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .perfil-preview {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .avatar-grande {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #81c784;
            background: #181818;
            flex-shrink: 0;
        }
        .perfil-meta h3 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .perfil-meta p {
            font-size: 13px;
            color: #b0b0b0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .campo.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-size: 13px;
            color: #cfd8dc;
            font-weight: 600;
        }
        input[type="text"],
        input[type="number"],
        input[type="email"],
        select {
            background: #181c19;
            border: 1px solid rgba(129, 199, 132, 0.25);
            border-radius: 10px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
        }
        input:focus, select:focus {
            border-color: #81c784;
            box-shadow: 0 0 0 2px rgba(129, 199, 132, 0.15);
        }
        input[readonly] {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .acciones-form {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-guardar {
            background: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .btn-guardar:hover {
            background: #388e3c;
            box-shadow: 0 0 14px rgba(129, 199, 132, 0.35);
        }

        .mensaje-estado {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
        }

        /* DISEÑO RESPONSIVO MÓVIL (BARRA INFERIOR FLOTANTE) */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; margin-top: 65px; min-height: auto; }
            .container { padding: 20px 15px 100px 15px; width: 100%; }

            .sidebar {
                position: fixed; bottom: 0; top: auto; left: 0; width: 100%; min-width: 100%; height: 72px;
                background: rgba(14, 14, 14, 0.97); backdrop-filter: blur(15px); border-right: none;
                border-top: 1px solid rgba(129, 199, 132, 0.3); padding: 0; flex-direction: row;
                justify-content: space-around; align-items: center; z-index: 1000;
            }
            .sidebar-menu { flex-direction: row; width: 100%; height: 100%; justify-content: space-around; align-items: center; }

            .sidebar button {
                width: auto; flex: 1; height: 100%; padding: 8px 2px; margin-bottom: 0; border: none;
                border-radius: 0; background: transparent; font-size: 10px; font-weight: 500; text-align: center;
                display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
                white-space: nowrap; color: #cccccc;
            }
            .sidebar button span:first-child { font-size: 16px; line-height: 1; }
            .label-escritorio { display: none; }
            .label-movil { display: inline; }

            .sidebar button:hover, .sidebar button.active { background: rgba(255, 255, 255, 0.03); color: #81c784; padding-left: 2px; }
            .sidebar button.active { color: #81c784; font-weight: bold; }

            .footer-privacidad { display: none; }
            .form-grid { grid-template-columns: 1fr; }
            .box-config { padding: 20px; }
        }

        @media (max-width: 600px) {
            .navbar { padding: 0 10px; }
            .logo { width: 24px; height: 24px; }
            .titulo { font-size: 16px; }
            .menu { gap: 8px; }
            .menu a { font-size: 11px; }
            .btn-volver-admin-menu { padding: 5px 7px; font-size: 10.5px !important; gap: 3px; }
            .admin-texto-largo { display: none; }
            .admin-texto-corto { display: inline; }
            .notif-icon-img, .user-icon { width: 32px; height: 32px; }
            .notif-icon-img { padding: 5px; }
            .sidebar button { font-size: 9px; }
            .sidebar button span:first-child { font-size: 15px; }
            .notif-dropdown {
                position: fixed !important;
                top: 70px !important;
                left: 15px !important;
                right: 15px !important;
                width: auto !important;
                max-width: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-nombre">
            <span class="titulo">ConSiente</span>
            <img src="imagenes/logo.png" class="logo" alt="Logo">
        </div>
        <div class="menu">
            <a id="btnVolverAdminMenu" class="btn-volver-admin-menu" onclick="volverAlPanelAdmin()">
                <span>🛡️</span>
                <span class="admin-texto-largo">Panel Admin</span>
                <span class="admin-texto-corto">Admin</span>
            </a>

            <!-- NOTIFICACIONES -->
            <div class="notif-wrapper">
                <img src="imagenes/notificacion.png" class="notif-icon-img" id="notifBtn" alt="Notificaciones" title="Notificaciones">
                <span class="notif-badge" id="notifBadge" style="display:none;">0</span>

                <div class="notif-dropdown" id="notifDropdown">
                    <div class="notif-header">
                        <h4>Notificaciones</h4>
                        <span id="marcarTodasLeidasBtn">Marcar leídas</span>
                    </div>
                    <div class="notif-list" id="notifList"></div>
                </div>
            </div>

            <a href="menu.html">Home</a>
            <a href="nosotros.html">Sobre nosotros</a>
            <a href="ODS.html">ODS</a>

            <div class="user-menu" onclick="toggleUserMenu(event)">
                <img src="imagenes/usuario.png" class="user-icon" id="userBtn" alt="Usuario">
                <div class="dropdown" id="dropdownMenu">
                    <a href="config.html">Configuración</a>
                    <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </div>

    <div class="main-layout">

        <!-- SIDEBAR / BARRA INFERIOR FLOTANTE -->
        <div class="sidebar">
            <div class="sidebar-menu">
                <button onclick="window.location.href='menu.html'"><span>📊</span> <span>Estadísticas</span></button>
                <button onclick="window.location.href='agregar.html'">
                    <span>➕</span>
                    <span class="label-escritorio">Agregar gasto</span>
                    <span class="label-movil">Agregar</span>
                </button>
                <button onclick="window.location.href='historial.html'"><span>📅</span> <span>Historial</span></button>
                <button onclick="window.location.href='semaforo.html'">
                    <span>🚦</span>
                    <span class="label-escritorio">Semáforo financiero</span>
                    <span class="label-movil">Semáforo</span>
                </button>
                <button onclick="window.location.href='metas.html'"><span>🎯</span> <span>Metas</span></button>
                <button onclick="window.location.href='racha.html'"><span>🔥</span> <span>Racha</span></button>
                <button onclick="window.location.href='consejos.html'"><span>💡</span> <span>Consejos</span></button>
            </div>
            <div class="footer-privacidad">
                <a href="privacidadentro.html">Políticas de Privacidad</a>
            </div>
        </div>

        <div class="container">
            <h2>Configuración de cuenta y presupuesto</h2>

            <div class="box-config">
                <div class="perfil-preview">
                    <img src="imagenes/usuario.png" alt="Avatar" class="avatar-grande" id="previewAvatar">
                    <div class="perfil-meta">
                        <h3 id="nombreMostrar">Cargando usuario...</h3>
                        <p id="correoMostrar">—</p>
                    </div>
                </div>

                <form id="formConfig" onsubmit="guardarConfiguracion(event)">
                    <div class="form-grid">
                        <div class="campo">
                            <label for="inputNombre">Nombre</label>
                            <input type="text" id="inputNombre" required placeholder="Tu nombre">
                        </div>

                        <div class="campo">
                            <label for="inputCorreo">Correo electrónico</label>
                            <input type="email" id="inputCorreo" readonly>
                        </div>

                        <div class="campo">
                            <label for="inputSaldo">Presupuesto mensual ($)</label>
                            <input type="number" id="inputSaldo" step="0.01" min="0" required placeholder="0.00">
                        </div>

                        <div class="campo">
                            <label for="selectAvatar">Avatar</label>
                            <select id="selectAvatar" onchange="actualizarVistaAvatar()">
                                <option value="imagenes/usuario.png">Avatar Predeterminado</option>
                                <option value="imagenes/avatar1.png">Avatar 1</option>
                                <option value="imagenes/avatar2.png">Avatar 2</option>
                                <option value="imagenes/avatar3.png">Avatar 3</option>
                            </select>
                        </div>
                    </div>

                    <div class="acciones-form">
                        <button type="submit" class="btn-guardar">Guardar cambios</button>
                    </div>

                    <div class="mensaje-estado" id="mensajeEstado"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "";

        function volverAlPanelAdmin() {
            localStorage.removeItem("modoVistaAdmin");
            window.location.href = "admin.html";
        }

        function evaluarVisibilidadBotonAdmin(rolDesdePerfil = "") {
            const rolStorage = (localStorage.getItem("rol") || "").toLowerCase();
            const rolPerfil = String(rolDesdePerfil || "").toLowerCase();
            const modoVistaAdmin = localStorage.getItem("modoVistaAdmin");
            const btnAdmin = document.getElementById("btnVolverAdminMenu");

            if (!btnAdmin) return;

            if (rolStorage === "admin" || rolPerfil === "admin" || modoVistaAdmin === "activo") {
                btnAdmin.style.display = "inline-flex";
            } else {
                btnAdmin.style.display = "none";
            }
        }

        function toggleUserMenu(e) {
            e.stopPropagation();
            const dropdownMenu = document.getElementById("dropdownMenu");
            const notifDropdown = document.getElementById("notifDropdown");
            if (notifDropdown) notifDropdown.classList.remove("show");
            if (dropdownMenu) {
                dropdownMenu.classList.toggle("show");
            }
        }

        function actualizarVistaAvatar() {
            const valor = document.getElementById("selectAvatar").value;
            document.getElementById("previewAvatar").src = valor;
        }

        document.addEventListener("DOMContentLoaded", () => {
            evaluarVisibilidadBotonAdmin();

            window.addEventListener("click", (e) => {
                const dropdownMenu = document.getElementById("dropdownMenu");
                const userMenu = document.querySelector(".user-menu");
                if (dropdownMenu && userMenu && !userMenu.contains(e.target)) {
                    dropdownMenu.classList.remove("show");
                }
            });

            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "index.html";
                return;
            }
            cargarConfiguracion();
        });

        async function cargarConfiguracion() {
            const token = localStorage.getItem("token");
            if (!token) return;

            try {
                const response = await fetch(`${API_URL}/api/perfil`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (!response.ok) return;

                const perfil = await response.json();
                if (perfil.rol) {
                    localStorage.setItem("rol", perfil.rol);
                }
                evaluarVisibilidadBotonAdmin(perfil.rol);

                const nombre = perfil.nombre || "Usuario";
                const correo = perfil.correo || perfil.email || "";
                const saldo = parseFloat(perfil.saldo || 0).toFixed(2);
                const avatar = (perfil.avatar || "imagenes/usuario.png").trim();

                document.getElementById("nombreMostrar").innerText = nombre;
                document.getElementById("correoMostrar").innerText = correo || "Cuenta activa";
                document.getElementById("inputNombre").value = nombre;
                document.getElementById("inputCorreo").value = correo;
                document.getElementById("inputSaldo").value = saldo;

                const selectAvatar = document.getElementById("selectAvatar");
                const existeOpcion = Array.from(selectAvatar.options).some(opt => opt.value === avatar);
                if (!existeOpcion && avatar) {
                    const nuevaOpt = document.createElement("option");
                    nuevaOpt.value = avatar;
                    nuevaOpt.textContent = "Avatar actual";
                    selectAvatar.appendChild(nuevaOpt);
                }
                selectAvatar.value = avatar;

                document.getElementById("previewAvatar").src = avatar;
                document.getElementById("userBtn").src = avatar;
                localStorage.setItem("userAvatar", avatar);
            } catch (e) {
                console.error("Error al cargar configuración:", e);
            }
        }

        async function guardarConfiguracion(event) {
            event.preventDefault();
            const token = localStorage.getItem("token");
            const mensajeEl = document.getElementById("mensajeEstado");

            const nombre = document.getElementById("inputNombre").value.trim();
            const saldo = parseFloat(document.getElementById("inputSaldo").value || 0);
            const avatar = document.getElementById("selectAvatar").value.trim();

            try {
                const response = await fetch(`${API_URL}/api/perfil`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ nombre, saldo, avatar })
                });

                if (response.ok) {
                    mensajeEl.style.color = "#81c784";
                    mensajeEl.innerText = "Cambios guardados correctamente.";
                    document.getElementById("nombreMostrar").innerText = nombre;
                    document.getElementById("previewAvatar").src = avatar;
                    document.getElementById("userBtn").src = avatar;
                    localStorage.setItem("userAvatar", avatar);
                } else {
                    const err = await response.json().catch(() => ({}));
                    mensajeEl.style.color = "#ef5350";
                    mensajeEl.innerText = err.error || "No se pudieron guardar los cambios.";
                }
            } catch (e) {
                console.error("Error al guardar configuración:", e);
                mensajeEl.style.color = "#ef5350";
                mensajeEl.innerText = "Error de conexión al guardar.";
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>

    <!-- SCRIPT GLOBAL DE NOTIFICACIONES -->
    <script src="global-notificaciones.js" defer></script>
</body>
</html>

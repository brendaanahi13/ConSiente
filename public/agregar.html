<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConSiente</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }
        
        /* Fondo con una luz difuminada central muy ligera */
        body { 
            background: radial-gradient(circle at 50% 50%, #27312a 0%, #111412 100%); 
            min-height: 100vh; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar { 
            position:fixed; 
            top:0; 
            left: 0;
            width:100%; 
            height:65px; 
            background:#0d0d0d; 
            display:flex; 
            justify-content:space-between; 
            align-items:center; 
            padding:0 25px; 
            z-index:1000; 
            border-bottom: 1px solid rgba(129, 199, 132, 0.25); 
        }
        .logo-nombre { display:flex; align-items:center; gap:10px; }
        .titulo { font-size:20px; font-weight:bold; color:#ffffff; letter-spacing: 0.5px; }
        .logo { width:30px; }
        .menu { display:flex; align-items:center; gap:25px; }
        .menu a { text-decoration:none; color:#e0e0e0; font-size: 14px; transition: 0.3s ease; }
        .menu a:hover { color: #81c784; }

        /* MENÚ DE USUARIO DESLIZABLE / DROPDOWN */
        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
        }
        .user-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            border: 1.5px solid rgba(129, 199, 132, 0.5);
            transition: 0.3s ease;
        }
        .user-icon:hover {
            border-color: #81c784;
            box-shadow: 0 0 10px rgba(129, 199, 132, 0.4);
        }
        .dropdown {
            position: absolute;
            right: 0;
            top: 50px;
            background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(129, 199, 132, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            min-width: 160px;
            overflow: hidden;
            z-index: 1100;
        }
        .dropdown a {
            padding: 12px 18px;
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            transition: 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dropdown a:last-child { border-bottom: none; }
        .dropdown a:hover {
            background: rgba(46, 125, 50, 0.3);
            color: #81c784;
        }
        .show { display: flex; }

        /* CONTENEDOR ESTRUCTURAL (SIDEBAR + MAIN) */
        .main-layout {
            display: flex;
            margin-top: 65px; /* Altura de la navbar */
            min-height: calc(100vh - 65px);
            width: 100%;
        }

        /* SIDEBAR */
        .sidebar { 
            width: 280px; 
            min-width: 280px;
            background:#121212; 
            border-right: 1px solid rgba(129, 199, 132, 0.15); 
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Empuja el footer hacia abajo */
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
        }
        .sidebar button { 
            width:100%; 
            padding:16px; 
            margin-bottom:15px; 
            border:none; 
            border-radius:12px; 
            background:#1b1b1b; 
            color:#ffffff;
            font-size:15px; 
            cursor:pointer; 
            text-align:left; 
            border-bottom:1px solid rgba(130,199,132,0.2); 
            transition: 0.3s ease;
        }
        .sidebar button:hover { 
            background:#1c2d20; 
            color: #81c784;
            border-bottom:1px solid rgba(130,199,132,0.5); 
            padding-left: 22px;
        }

        /* política de privacidad integrada correctamente */
        .footer-privacidad { padding-top: 15px; text-align: center; }
        .footer-privacidad a { color: rgba(255, 255, 255, 0.5); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.3s ease; }
        .footer-privacidad a:hover { color: #81c784; }

        /* CONTENEDOR PRINCIPAL */
        .container { 
            flex: 1;
            padding: 40px; 
            display: flex; 
            gap: 25px; 
            max-width: 1200px;
            margin: 0 auto; /* Centra el contenido en pantallas gigantes */
            align-items: flex-start;
        }
        
        /* Cajas con profundidad limpia */
        .box { 
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            padding: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); 
        }
        .box-formulario { flex: 1.3; }
        .box-grafica { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background: radial-gradient(circle at top, rgba(46, 125, 50, 0.12) 0%, rgba(22, 22, 22, 0.85) 70%);
        }

        /* FORMULARIO ELEGANTE */
        .formulario label { display: block; margin-top: 15px; color: #ffffff; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .formulario input { 
            width: 100%; 
            padding: 12px 14px; 
            margin-top: 6px; 
            border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.15);
            background: #1a1a1a; 
            color: #ffffff; 
            font-size: 15px;
            transition: 0.3s ease;
        }
        .formulario input:focus {
            outline: none;
            border-color: rgba(129, 199, 132, 0.7);
            background: #222222;
            box-shadow: 0 0 8px rgba(129, 199, 132, 0.2);
        }
        
        .btn-guardar { 
            width: 100%; 
            margin-top: 25px; 
            padding: 14px; 
            background: #2e7d32; 
            border: none; 
            border-radius: 12px; 
            color: #ffffff; 
            font-weight: 600;
            font-size: 15px;
            cursor: pointer; 
            transition: 0.3s ease; 
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }
        .btn-guardar:hover { 
            background: #388e3c; 
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
        }
        
        h2, h3 { color: #81c784; font-weight: 600; letter-spacing: 0.3px; }
        h2 { margin-bottom: 20px; }
        h3 { margin-bottom: 25px; }

        /* RESPONSIVIDAD PARA TABLETS Y MÓVILES */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: auto; border-right: none; border-bottom: 1px solid rgba(129, 199, 132, 0.15); }
            .container { flex-direction: column; padding: 20px; width: 100%; }
            .box { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-nombre">
            <span class="titulo">ConSiente</span>
            <img src="imagenes/logo.png" class="logo" alt="Logo">
        </div>
        
        <div class="menu">
            <a href="menu.html">Home</a>
            <a href="nosotros.html">Sobre nosotros</a>
            <a href="ODS.html">ODS</a>
            
            <div class="user-menu">
                <img src="imagenes/usuario.png" class="user-icon" id="userBtn" alt="Usuario">
                <div class="dropdown" id="dropdownMenu">
                    <a href="config.html">Configuración</a>
                    <a href="index.html" onclick="cerrarSesion()">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </div>

    <div class="main-layout">
        
        <div class="sidebar">
            <div class="sidebar-menu">
                <button onclick="window.location.href='menu.html'">📊 Mis Estadísticas</button>
                <button onclick="window.location.href='consejos.html'">💡 Consejos de Ahorro</button>
                <button onclick="window.location.href='agregar.html'">➕ Agregar gasto</button>
                <button onclick="window.location.href='historial.html'">📅 Historial</button>
                <button onclick="window.location.href='semaforo.html'">🚦 Semáforo Financiero</button>
            </div>
            <div class="footer-privacidad">
                <a href="privacidadentro.html">Políticas de Privacidad</a>
            </div>
        </div>

        <div class="container">
            <div class="box box-formulario">
                <h2>Agregar gasto</h2>
                <div class="formulario">
                    <label>Categoría</label>
                    <input type="text" id="tipoGasto" list="categorias" placeholder="Selecciona o escribe...">
                    <datalist id="categorias">
                        <option value="Necesario">
                        <option value="Antojos / comida rápida">
                        <option value="Salidas / ocio">
                        <option value="Transporte">
                        <option value="Servicios / luz / agua">
                        <option value="Salud / medicina">
                        <option value="Educación">
                        <option value="Ropa / accesorios">
                    </datalist>

                    <label>Monto</label>
                    <input type="number" id="cantidadGasto" placeholder="$ 0.00">
                    <label>Fecha</label>
                    <input type="date" id="fechaGasto">
                    <button class="btn-guardar" onclick="guardarGasto()">Guardar gasto</button>
                </div>
            </div>

            <div class="box box-grafica">
                <h3>Tu Disponibilidad</h3>
                <div style="width: 85%; position: relative;">
                    <canvas id="graficaPresupuesto"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Lógica del menú desplegable del usuario
        const btn = document.getElementById("userBtn");
        const menu = document.getElementById("dropdownMenu");

        btn.onclick = (e) => {
            e.stopPropagation();
            menu.classList.toggle("show");
        };

        window.onclick = (e) => {
            if (!e.target.matches('#userBtn')) {
                menu.classList.remove("show");
            }
        };

        function cerrarSesion(){
            sessionStorage.removeItem("sesionActiva");
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }

        // Establecer por defecto la fecha de hoy en el input
        document.getElementById('fechaGasto').valueAsDate = new Date();

        async function renderizarGrafica() {
            try {
                const token = localStorage.getItem("token");
                const resGastos = await fetch("http://localhost:3000/api/lista-gastos", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const todosLosGastos = await resGastos.json();
                
                const hoy = new Date();
                const mesActual = hoy.getMonth();
                const anioActual = hoy.getFullYear();

                const totalGastadoMes = todosLosGastos.reduce((sum, item) => {
                    const fechaGasto = new Date(item.fecha);
                    if (fechaGasto.getMonth() === mesActual && fechaGasto.getFullYear() === anioActual) {
                        return sum + parseFloat(item.monto || item.cantidad || item.total || 0);
                    }
                    return sum;
                }, 0);
                
                const saldoTotal = parseFloat(localStorage.getItem("saldoUsuario")) || 0;
                const restante = Math.max(0, saldoTotal - totalGastadoMes);

                if (window.miGrafica) window.miGrafica.destroy();
                const ctx = document.getElementById('graficaPresupuesto').getContext('2d');
                
                window.miGrafica = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['Gastado este mes', 'Disponible'],
                        datasets: [{
                            data: [totalGastadoMes, restante],
                            backgroundColor: ['#ef5350', '#2e7d32'],
                            borderWidth: 3,
                            borderColor: '#161616'
                        }]
                    },
                    options: { 
                        responsive: true, 
                        plugins: { 
                            legend: { 
                                position: 'bottom',
                                labels: { 
                                    color: '#ffffff',
                                    padding: 20,
                                    font: { family: "'Segoe UI', sans-serif", size: 12, weight: '500' } 
                                } 
                            } 
                        } 
                    }
                });
            } catch(e) { console.error("Error al graficar:", e); }
        }

        async function guardarGasto() {
            const categoria = document.getElementById('tipoGasto').value;
            const monto = document.getElementById('cantidadGasto').value;
            const fecha = document.getElementById('fechaGasto').value;

            if (!categoria || !monto || !fecha) {
                alert("⚠️ Por favor, completa todos los campos.");
                return;
            }

            const response = await fetch("http://localhost:3000/api/gastos", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${localStorage.getItem("token")}` },
                body: JSON.stringify({ categoria, monto, fecha })
            });

            if(response.ok) { 
                alert("✅ ¡Gasto registrado!"); 
                document.getElementById('tipoGasto').value = '';
                document.getElementById('cantidadGasto').value = '';
                renderizarGrafica(); 
            } else {
                alert("❌ Error al guardar.");
            }
        }
        
        renderizarGrafica();
    </script>
</body>
</html>

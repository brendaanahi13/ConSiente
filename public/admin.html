<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Pro - ConSiente</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: bold; letter-spacing: 0.5px; }
        .card-stat { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-3px); }
        .table-container { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; }
        .badge-admin { background-color: #dc3545; }
        .badge-usuario { background-color: #198754; }
    </style>
</head>
<body>

    <!-- NAVBAR DE ADMINISTRACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-shield-alt text-warning me-2"></i>ConSiente | Admin Pro</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3 d-none d-md-inline" id="adminNombre">Administrador</span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt me-1"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-4">
        
        <!-- TARJETAS DE ESTADÍSTICAS RÁPIDAS -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-stat p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Total de Usuarios</h6>
                            <h3 class="fw-bold mb-0" id="statTotalUsuarios">0</h3>
                        </div>
                        <div class="bg-primary bg-opacity-15 p-3 rounded-circle text-primary">
                            <i class="fas fa-users fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Administradores</h6>
                            <h3 class="fw-bold mb-0" id="statTotalAdmins">0</h3>
                        </div>
                        <div class="bg-danger bg-opacity-15 p-3 rounded-circle text-danger">
                            <i class="fas fa-user-shield fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Acciones Rápidas</h6>
                            <button class="btn btn-dark btn-sm mt-1" data-bs-toggle="modal" data-bs-target="#modalSubadmin">
                                <i class="fas fa-user-plus me-1"></i> Crear Sub-Admin
                            </button>
                        </div>
                        <div class="bg-success bg-opacity-15 p-3 rounded-circle text-success">
                            <i class="fas fa-cogs fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN DE GESTIÓN DE USUARIOS -->
        <div class="table-container">
            <div class="row align-items-center mb-3">
                <div class="col-md-6">
                    <h5 class="fw-bold mb-0"><i class="fas fa-address-book me-2 text-primary"></i>Gestión de Usuarios</h5>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por nombre o correo..." onkeyup="filtrarUsuarios()">
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Saldo</th>
                            <th>Racha</th>
                            <th>Rol</th>
                            <th>Último Ingreso</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuariosBody">
                        <tr>
                            <td colspan="8" class="text-center py-4 text-muted">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- MODAL: EDITAR USUARIO -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fas fa-user-edit me-2"></i>Editar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarUsuario">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="editNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="editCorreo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Saldo (MXN)</label>
                            <input type="number" step="0.01" id="editSaldo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select id="editRol" class="form-select">
                                <option value="usuario">Usuario</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CREAR SUB-ADMIN -->
    <div class="modal fade" id="modalSubadmin" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fas fa-user-shield me-2"></i>Registrar Sub-Administrador</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formCrearSubadmin">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" id="subNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="subCorreo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña Temporal</label>
                            <input type="password" id="subPassword" class="form-control" required>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-dark">Crear Administrador</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SCRIPT DE CONTROL DEL PANEL -->
    <script>
        const token = localStorage.getItem("token");
        const rol = localStorage.getItem("rol");

        // 1. Validar seguridad de acceso al cargar la página
        if (!token || rol !== 'admin') {
            alert("Acceso denegado. Se requieren privilegios de administrador.");
            window.location.href = "index.html"; // O tu página de login
        } else {
            document.getElementById("adminNombre").textContent = localStorage.getItem("nombre") || "Administrador";
        }

        let listaUsuariosGlobal = [];

        // 2. Cargar usuarios y estadísticas al iniciar
        document.addEventListener("DOMContentLoaded", () => {
            cargarUsuarios();
        });

        function cargarUsuarios(busqueda = '') {
            fetch(`/api/admin/usuarios?buscar=${encodeURIComponent(busqueda)}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(res => {
                if (!res.ok) throw new Error("Error al obtener los usuarios");
                return res.json();
            })
            .then(usuarios => {
                listaUsuariosGlobal = usuarios;
                renderizarTabla(usuarios);
                actualizarEstadisticas(usuarios);
            })
            .catch(err => {
                console.error(err);
                document.getElementById("tablaUsuariosBody").innerHTML = `
                    <tr><td colspan="8" class="text-center text-danger py-4">Error al conectar con el servidor o sesión expirada.</td></tr>
                `;
            });
        }

        function renderizarTabla(usuarios) {
            const tbody = document.getElementById("tablaUsuariosBody");
            tbody.innerHTML = "";

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No se encontraron usuarios registrados.</td></tr>`;
                return;
            }

            usuarios.forEach(u => {
                const badgeRol = u.rol === 'admin' ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-usuario">Usuario</span>';
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>#${u.id}</td>
                    <td class="fw-semibold">${u.nombre}</td>
                    <td>${u.correo}</td>
                    <td>$${Number(u.saldo || 0).toFixed(2)}</td>
                    <td><i class="fas fa-fire text-danger me-1"></i>${u.racha_dias || 0} días</td>
                    <td>${badgeRol}</td>
                    <td>${u.ultimo_ingreso || 'Nunca'}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirEditar(${u.id}, '${u.nombre}', '${u.correo}', ${u.saldo}, '${u.rol}')" title="Editar">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuario(${u.id})" title="Eliminar">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function actualizarEstadisticas(usuarios) {
            document.getElementById("statTotalUsuarios").textContent = usuarios.length;
            const totalAdmins = usuarios.filter(u => u.rol === 'admin').length;
            document.getElementById("statTotalAdmins").textContent = totalAdmins;
        }

        // Búsqueda en tiempo real
        function filtrarUsuarios() {
            const texto = document.getElementById("inputBuscar").value.toLowerCase();
            const filtrados = listaUsuariosGlobal.filter(u => 
                u.nombre.toLowerCase().includes(texto) || u.correo.toLowerCase().includes(texto)
            );
            renderizarTabla(filtrados);
        }

        // Abrir Modal de Edición con datos previos
        function abrirEditar(id, nombre, correo, saldo, rolUser) {
            document.getElementById("editId").value = id;
            document.getElementById("editNombre").value = nombre;
            document.getElementById("editCorreo").value = correo;
            document.getElementById("editSaldo").value = saldo;
            document.getElementById("editRol").value = rolUser;

            const modal = new bootstrap.Modal(document.getElementById('modalEditar'));
            modal.show();
        }

        // Enviar formulario de edición
        document.getElementById("formEditarUsuario").addEventListener("submit", (e) => {
            e.preventDefault();
            const id = document.getElementById("editId").value;
            const datos = {
                nombre: document.getElementById("editNombre").value,
                correo: document.getElementById("editCorreo").value,
                saldo: parseFloat(document.getElementById("editSaldo").value),
                rol: document.getElementById("editRol").value
            };

            fetch(`/api/admin/usuarios/${id}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(res => res.json())
            .then(data => {
                alert(data.mensaje || "Actualizado con éxito");
                bootstrap.Modal.getInstance(document.getElementById('modalEditar')).hide();
                cargarUsuarios();
            })
            .catch(err => alert("Error al actualizar usuario"));
        });

        // Eliminar usuario
        function eliminarUsuario(id) {
            if (!confirm("¿Estás seguro de eliminar este usuario? Se borrarán todos sus movimientos y metas asociadas.")) return;

            fetch(`/api/admin/usuarios/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                alert(data.mensaje || "Usuario eliminado");
                cargarUsuarios();
            })
            .catch(err => alert("Error al eliminar usuario"));
        }

        // Crear Sub-Administrador
        document.getElementById("formCrearSubadmin").addEventListener("submit", (e) => {
            e.preventDefault();
            const datos = {
                nombre: document.getElementById("subNombre").value,
                correo: document.getElementById("subCorreo").value,
                password: document.getElementById("subPassword").value
            };

            fetch('/api/admin/crear-subadmin', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(res => {
                if (!res.ok) return res.json().then(err => { throw new Error(err.error); });
                return res.json();
            })
            .then(data => {
                alert(data.message || "Sub-administrador creado con éxito");
                document.getElementById("formCrearSubadmin").reset();
                bootstrap.Modal.getInstance(document.getElementById('modalSubadmin')).hide();
                cargarUsuarios();
            })
            .catch(err => alert(err.message || "Error al crear sub-administrador"));
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
